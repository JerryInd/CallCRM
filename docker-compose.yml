services:
  app:
    build: .
    image: callcrm:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      DB_PATH: /data/callcrm.sqlite
    volumes:
      - app-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
